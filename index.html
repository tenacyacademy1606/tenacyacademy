/* LOGIN */
.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1d4ed8,#2563eb,#60a5fa);
}

.login-box{
    width:380px;
    background:white;

    border-radius:15px;
    box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.login-box h1{
    text-align:center;

    margin-bottom:8px;

.login-box p{

}

.login-box input,
.login-box select{
    width:100%;

.login-btn{
    width:100%;

    padding:13px;

    border-radius:8px;
    background:#2563eb;

    font-size:16px;

}

.login-btn:hover{
    background:#1d4ed8;
}

#error{
    color:red;
    text-align:center;
    margin-top:12px;
}

/* DASHBOARD */
.dashboard{
    display:none;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:240px;
    background:#172554;
    color:white;
    padding:20px;
}

.logo{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:30px;
}

.sidebar button{
    width:100%;
    padding:12px;
    margin:5px 0;
    border:0;
    border-radius:7px;
    background:transparent;
    color:white;
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

.sidebar button:hover{
    background:#2563eb;
}

.logout{
    margin-top:30px !important;
    background:#dc2626 !important;
}

.main{
    margin-left:240px;
    padding:25px;
}

.topbar{
    background:white;
    padding:18px 25px;
    border-radius:10px;
    margin-bottom:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.topbar h2{
    color:#172554;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.card h3{
    color:#555;
    font-size:15px;
}

.card .number{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
    color:#2563eb;
}

.content{
    background:white;
    margin-top:25px;
    padding:25px;
    border-radius:12px;
}

.content h2{
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#eff6ff;
}

@media(max-width:800px){

    .sidebar{
        width:190px;
    }

    .main{
        margin-left:190px;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
    }

    .cards{
        grid-template-columns:1fr;
    }
}
</style>
</head>

function addMenu(text){

    const menu = document.getElementById("menu");

    const button = document.createElement("button");

    button.innerText = text;

    button.onclick = function(){

        document.getElementById("content").innerHTML = 
            <h2>${text}</h2>
            <p>This section will be connected to the database in the next version.</p>
        ;

    };

    menu.appendChild(button);

}


function createCard(title,number){

    const cards = document.getElementById("cards");

    const card = document.createElement("div");

    card.className="card";

    card.innerHTML=
        <h3>${title}</h3>
        <div class="number">${number}</div>
    ;

    cards.appendChild(card);

}


function logout(){

    document.getElementById("dashboard").style.display="none";
    document.getElementById("loginPage").style.display="flex";

    document.getElementById("username").value="";
    document.getElementById("password").value="";
    document.getElementById("error").innerText="";

}
