<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Online System</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f5f9;
}

.login{
    width:350px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #aaa;
}

h1{
    text-align:center;
    color:#174a8b;
}

input,select{
    width:100%;
    padding:13px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:13px;
    background:#174a8b;
    color:white;
    border:0;
    border-radius:7px;
    cursor:pointer;
}

#error{
    color:red;
    text-align:center;
    margin-top:10px;
}

#dashboard{
    display:none;
}

.header{
    background:#174a8b;
    color:white;
    padding:20px;
}

.container{
    padding:25px;
}

.card{
    display:inline-block;
    background:white;
    width:200px;
    margin:10px;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px #ddd;
}

.logout{
    width:auto;
    background:#d62828;
    float:right;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login">

<h1>🏫 School Online</h1>

<input id="username" type="text" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<select id="role">
<option value="admin">Admin</option>
<option value="teacher">Teacher</option>
<option value="parent">Parent</option>
<option value="student">Student</option>
</select>

<button type="button" onclick="login()">LOGIN</button>

<div id="error"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

<div class="header">

<button class="logout" type="button" onclick="logout()">
Logout
</button>

<h2>🏫 School Online System</h2>

<p id="welcome"></p>

</div>

<div class="container">

<h1>Dashboard</h1>

<div class="card">
<h3>👨‍🎓 Students</h3>
<h2>0</h2>
</div>

<div class="card">
<h3>👨‍🏫 Teachers</h3>
<h2>0</h2>
</div>

<div class="card">
<h3>👨‍👩‍👧 Parents</h3>
<h2>0</h2>
</div>

<div class="card">
<h3>📝 Attendance</h3>
<h2>0</h2>
</div>

</div>

</div>


<script>

function login(){

    let username =
        document.getElementById("username").value.trim();

    let password =
        document.getElementById("password").value.trim();

    let role =
        document.getElementById("role").value;

    if(
        username === "admin" &&
        password === "admin123" &&
        role === "admin"
    ){

        document.getElementById("loginPage").style.display="none";

        document.getElementById("dashboard").style.display="block";

        document.getElementById("welcome").innerText =
            "Welcome Admin";

    }
    else if(
        username === "teacher" &&
        password === "teacher123" &&
        role === "teacher"
    ){

        document.getElementById("loginPage").style.display="none";

        document.getElementById("dashboard").style.display="block";

        document.getElementById("welcome").innerText =
            "Welcome Teacher";

    }
    else if(
        username === "parent" &&
        password === "parent123" &&
        role === "parent"
    ){

        document.getElementById("loginPage").style.display="none";

        document.getElementById("dashboard").style.display="block";

        document.getElementById("welcome").innerText =
            "Welcome Parent";

    }
    else if(
        username === "student" &&
        password === "student123" &&
        role === "student"
    ){

        document.getElementById("loginPage").style.display="none";

        document.getElementById("dashboard").style.display="block";

        document.getElementById("welcome").innerText =
            "Welcome Student";

    }
    else{

        document.getElementById("error").innerText =
            "Username, password or role is incorrect.";

    }
}


function logout(){

    document.getElementById("dashboard").style.display="none";

    document.getElementById("loginPage").style.display="block";

}

</script>

</body>
</html>
